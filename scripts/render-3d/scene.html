<body>
<script type="module">
import { createRenderer } from "./common.js";
import { scenes } from "./scenes.js";
const params = new URLSearchParams(location.search);
const size = Number(params.get("size")) || 800;
const renderer = createRenderer(size, params.get("alpha") === "1");
const built = scenes[params.get("scene")](renderer);
built.camera.aspect = 1;
built.camera.updateProjectionMatrix();
window.renderAt = (t) => {
  built.update(t);
  renderer.render(built.scene, built.camera);
  return renderer.domElement.toDataURL("image/png").split(",")[1];
};
await (built.ready || Promise.resolve());
window.__ready = true;
</script>
</body>
</html>
