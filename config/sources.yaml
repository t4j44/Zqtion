    active: true
    ingestion_method: "structured_web"
    crawl_allowed: true
    api_available: true
    github_available: true
    rss_available: false
    llms_txt_available: true
    sitemap_available: true
    content_license: "MIT"
    license_verified: true
    allowed_paths:
      - "/cookbook/**"
      - "/cookbook/topic/agents/**"
    blocked_paths:
      - "/pricing"
      - "/login"
    crawl_frequency: "weekly"
    requires_primary_verification: false
