version: "1.0"
description: "Zqtion Resource Intelligence — Multi-Source Registry Configuration"

defaults:
  rate_limit_seconds: 1.0
  max_retries: 3
  backoff_multiplier: 2.0
  storage_layer_a: ".resource-research/raw/"
  storage_layer_b: "content/resources/catalogue.json"
  verify_originality: true
  min_5gram_overlap_threshold: 0.15

